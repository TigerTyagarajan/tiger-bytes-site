name: "Publish Beyond Work cards"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify current index.html hash
        run: |
          set -euo pipefail
          echo "Verifying current index.html..."
          sha256sum index.html
          EXPECTED_OLD="0be407dac25e67b2ce393be96008577e6689df7c9a8bb702bda2f35cdd8791cd"
          ACTUAL_OLD="$(sha256sum index.html | awk '{print $1}')"
          if [ "$ACTUAL_OLD" != "$EXPECTED_OLD" ]; then
            echo "ABORT: current index.html hash mismatch. Expected $EXPECTED_OLD, got $ACTUAL_OLD"
            exit 1
          fi
          echo "Current index.html hash matches expected."
      - name: Replace index.html with granted payload
        run: |
          set -euo pipefail
          cp index-patched.html index.html
          echo "Verifying new index.html..."
          sha256sum index.html
          EXPECTED_NEW="1c9e73f9e870e73f373d67c351eb8f55e3ba73b058b05d0e17e423fbb7b7d768"
          ACTUAL_NEW="$(sha256sum index.html | awk '{print $1}')"
          if [ "$ACTUAL_NEW" != "$EXPECTED_NEW" ]; then
            echo "ABORT: new index.html hash mismatch. Expected $EXPECTED_NEW, got $ACTUAL_NEW"
            exit 1
          fi
          echo "New index.html hash matches expected."
      - name: Commit once and push
        run: |
          set -euo pipefail
          git config user.name "TigerTyagarajan"
          git config user.email "tigertyagarajan@gmail.com"
          rm -f index-patched.html .github/workflows/publish-beyond-work.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git add -A
          git status --short
          git commit -m "Beyond Work cards — Food, Travel and Night sky rewritten"
          git push
