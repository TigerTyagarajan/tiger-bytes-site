name: "Publish Food and Wine card"
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Verify pre-image, swap in staged files, verify post-images"
        shell: bash
        run: |
          set -euo pipefail
          cur=$(sha256sum "index.html" | cut -d" " -f1)
          if [ "$cur" != "c9ce458b5823581f9fb277d1640f5e199da81f15a15296b53e440044c9b7cd08" ]; then echo "PRE-IMAGE MISMATCH index.html: $cur"; exit 1; fi
          if [ -e "assets/douro-ferreira-rabelo.jpg" ]; then echo "assets/douro-ferreira-rabelo.jpg ALREADY EXISTS"; exit 1; fi
          if [ -e "assets/douro-valley-vineyards.jpg" ]; then echo "assets/douro-valley-vineyards.jpg ALREADY EXISTS"; exit 1; fi
          if [ -e "assets/japan-inari-shrine.jpg" ]; then echo "assets/japan-inari-shrine.jpg ALREADY EXISTS"; exit 1; fi
          if [ -e "assets/japan-traditional-pond.jpg" ]; then echo "assets/japan-traditional-pond.jpg ALREADY EXISTS"; exit 1; fi
          if [ -e "assets/bombay-coastal-road.jpg" ]; then echo "assets/bombay-coastal-road.jpg ALREADY EXISTS"; exit 1; fi
          if [ -e "assets/bombay-thaker-bhojanalay.jpg" ]; then echo "assets/bombay-thaker-bhojanalay.jpg ALREADY EXISTS"; exit 1; fi
          cp ".cta-staging/index.html" "index.html"
          cp ".cta-staging/assets/douro-ferreira-rabelo.jpg" "assets/douro-ferreira-rabelo.jpg"
          cp ".cta-staging/assets/douro-valley-vineyards.jpg" "assets/douro-valley-vineyards.jpg"
          cp ".cta-staging/assets/japan-inari-shrine.jpg" "assets/japan-inari-shrine.jpg"
          cp ".cta-staging/assets/japan-traditional-pond.jpg" "assets/japan-traditional-pond.jpg"
          cp ".cta-staging/assets/bombay-coastal-road.jpg" "assets/bombay-coastal-road.jpg"
          cp ".cta-staging/assets/bombay-thaker-bhojanalay.jpg" "assets/bombay-thaker-bhojanalay.jpg"
          new=$(sha256sum "index.html" | cut -d" " -f1)
          if [ "$new" != "62fac38737165ba25e6a951428142865a1ffa9c6b38cc720528b518936fe4f91" ]; then echo "POST-IMAGE MISMATCH index.html: $new"; exit 1; fi
          a1=$(sha256sum "assets/douro-ferreira-rabelo.jpg" | cut -d" " -f1)
          if [ "$a1" != "f0aad4e0f942eb3290152b29132f613de3626792d4298eb7c61368e1270c9414" ]; then echo "POST-IMAGE MISMATCH assets/douro-ferreira-rabelo.jpg: $a1"; exit 1; fi
          a2=$(sha256sum "assets/douro-valley-vineyards.jpg" | cut -d" " -f1)
          if [ "$a2" != "cae4d93fa735e33d2fb3202ec2d6cef0e9635f8fdeaec7bf93f968e5863545ad" ]; then echo "POST-IMAGE MISMATCH assets/douro-valley-vineyards.jpg: $a2"; exit 1; fi
          a3=$(sha256sum "assets/japan-inari-shrine.jpg" | cut -d" " -f1)
          if [ "$a3" != "d1f7156171de1d977bf4317747c92cf68af8e7e2b63db080f45f92cd74afb40a" ]; then echo "POST-IMAGE MISMATCH assets/japan-inari-shrine.jpg: $a3"; exit 1; fi
          a4=$(sha256sum "assets/japan-traditional-pond.jpg" | cut -d" " -f1)
          if [ "$a4" != "6fa9cf9ba93410f1465e4ba8fb3a4b7c2dd85662d5fd3f9043c56443301dbaaf" ]; then echo "POST-IMAGE MISMATCH assets/japan-traditional-pond.jpg: $a4"; exit 1; fi
          a5=$(sha256sum "assets/bombay-coastal-road.jpg" | cut -d" " -f1)
          if [ "$a5" != "a465d5dd6fa5cb220e58e45e2bc009bbf650b8634fa6e2518a631f1102ec86f4" ]; then echo "POST-IMAGE MISMATCH assets/bombay-coastal-road.jpg: $a5"; exit 1; fi
          a6=$(sha256sum "assets/bombay-thaker-bhojanalay.jpg" | cut -d" " -f1)
          if [ "$a6" != "29ac959ae41009163859b9b57fa705108a11d2b5196b193cc27a0352ec6e233a" ]; then echo "POST-IMAGE MISMATCH assets/bombay-thaker-bhojanalay.jpg: $a6"; exit 1; fi
          echo "OK index.html + 6 assets"
      - name: "Commit update and clean up"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tiger Tyagarajan"
          git config user.email "vn.tyagarajan@gmail.com"
          git add index.html assets/douro-ferreira-rabelo.jpg assets/douro-valley-vineyards.jpg assets/japan-inari-shrine.jpg assets/japan-traditional-pond.jpg assets/bombay-coastal-road.jpg assets/bombay-thaker-bhojanalay.jpg
          git commit -m "Expand Food & Wine corner: three pieces with photos"
          rm -rf .cta-staging .github/workflows/publish-food-wine.yml
          git add -A
          git commit -m "Remove Food & Wine publish staging and workflow" || true
          git push
