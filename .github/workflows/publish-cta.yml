name: "Publish CTA update"
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Verify pre-images, swap in patched files, verify post-images"
        shell: bash
        run: |
          set -euo pipefail
          check() {
            cur=$(sha256sum "$1" | cut -d" " -f1)
            if [ "$cur" != "$2" ]; then echo "PRE-IMAGE MISMATCH for $1"; exit 1; fi
            cp ".cta-staging/$1" "$1"
            new=$(sha256sum "$1" | cut -d" " -f1)
            if [ "$new" != "$3" ]; then echo "POST-IMAGE MISMATCH for $1"; exit 1; fi
            echo "OK $1"
          }
          check "index.html" "1c9e73f9e870e73f373d67c351eb8f55e3ba73b058b05d0e17e423fbb7b7d768" "65049b5691e6d457ff8d51d53d9dddb1ea05e1c6599db905dc5579192724412d"
          check "leading-with-curiosity.html" "cdc907762495e2918fd5132f9178b124093d7f7a2ef07e036768d904893c6177" "f7f154cd02eb20d964d3b54ed5cc6cc99fd69b280c35c423ce475fe6213493cc"
          check "what-the-world-has-taught-me.html" "42a713aa3c80cfa879e92f1b92f7b963e1047509fdce2b7b403343c35571588a" "436c766b78d3c2195604db83fcee7753f5fb8ab5c72661e6b5985c7187445686"
          check "what-cricket-has-taught-me-about-leadership.html" "93db846bae8ee39f7b9843a02a4f2073226e51a68cba1af87aa25940a88e9f38" "088629ebb29ca5851189f7341ffbccd2c6dc09c3f3703dc80aa987a0efb7201f"
      - name: "Commit update and clean up"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tiger Tyagarajan"
          git config user.email "vn.tyagarajan@gmail.com"
          git add index.html leading-with-curiosity.html what-the-world-has-taught-me.html what-cricket-has-taught-me-about-leadership.html
          git commit -m "Add subscribe and speaking calls to action"
          rm -rf .cta-staging .github/workflows/publish-cta.yml
          git add -A
          git commit -m "Remove CTA publish staging and workflow" || true
          git push
