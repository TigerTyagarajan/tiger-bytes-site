name: Add card visuals

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Generate cover images and patch index.html
        run: |
          python3 - <<'PY'
          import base64
          import re
          import subprocess
          from pathlib import Path
          root = Path('.')
          # 1. First slide of each deck PDF -> a standalone PNG in assets/
          decks = {
              'recode-keynote-deck': 'recode-keynote-deck-cover.png',
              'the-mathematics-singularity': 'mathematics-singularity-cover.png',
              'every-model-begins-with-a-prior-deck': 'every-model-deck-cover.png',
              'the-curiosity-engine': 'curiosity-engine-cover.png',
              'curiosity-the-strategic-advantage': 'curiosity-strategic-advantage-cover.png',
          }
          for stem, out in decks.items():
              assert Path(stem + '.pdf').exists(), stem + '.pdf missing'
              subprocess.run(['pdftoppm', '-png', '-f', '1', '-l', '1', '-r', '140', stem + '.pdf', 'assets/' + stem + '-cover'], check=True)
              produced = list(Path('assets').glob(stem + '-cover-*.png'))
              assert len(produced) == 1, 'pdftoppm produced ' + str(len(produced)) + ' files for ' + stem
              produced = produced[0]
              produced.rename(Path('assets') / out)
              print('cover', out, Path('assets/' + out).stat().st_size, 'bytes')
          # 2. Compass graphic from leading-with-curiosity.html -> standalone SVG in assets/
          lead = Path('leading-with-curiosity.html').read_text(encoding='utf-8')
          m = re.search(r'<svg viewBox="0 0 640 640".*?</svg>', lead, re.S)
          assert m, 'compass svg not found'
          svg = m.group(0)
          style = re.search(r'<style>(.*?)</style>', lead, re.S).group(1)
          if 'xmlns=' not in svg.split('>', 1)[0]:
              svg = svg.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ', 1)
          head, rest = svg.split('>', 1)
          svg = head + '><style><![CDATA[' + style + ']]></style>' + rest
          Path('assets/curiosity-compass.svg').write_text(svg, encoding='utf-8')
          print('compass', len(svg), 'chars')
          # 3. SarderTV video thumbnail from career-framework.html -> standalone JPEG in assets/
          career = Path('career-framework.html').read_text(encoding='utf-8')
          sm = re.search(r'src="data:image/jpeg;base64,([^"]+)"', career, re.S)
          assert sm, 'no base64 jpeg in career-framework.html'
          raw = base64.b64decode(re.sub(r'\s+', '', sm.group(1)))
          assert raw[:2] == b'\xff\xd8', 'decoded thumbnail is not a JPEG'
          Path('assets/career-sardertv-thumb.jpg').write_bytes(raw)
          print('career thumb', len(raw), 'bytes')
          # 4. Patch index.html: one 16/9 visual (the Talks video-facade treatment) at the top
          #    of each card that has a visual of its own, linked to that card's destination.
          html = Path('index.html').read_text(encoding='utf-8')
          css = '.card-visual{display:block;aspect-ratio:16/9;overflow:hidden;border-radius:6px;border:1px solid var(--line);margin-bottom:12px;background:#f3ead9}.card-visual img{width:100%;height:100%;object-fit:cover;display:block}.card-visual.contain img{object-fit:contain;background:#fffdf8}'
          assert html.count('</style>') == 1, 'style close count wrong'
          html = html.replace('</style>', css + '</style>', 1)
          def thumb(cls, href, img, alt, aria):
              return '<a class="' + cls + '" href="' + href + '" aria-label="' + aria + '"><img src="assets/' + img + '" alt="' + alt + '" loading="lazy"></a>'
          def insert_card(cls, tag, heading, snippet, label):
              global html
              art = r'(<article\b[^>]*class="[^"]*' + cls + r'[^"]*"[^>]*>)'
              mid = r'\s*(<span class="tag">' + re.escape(tag) + r'</span>\s*<h3>' + re.escape(heading) + r'</h3>)'
              pat = re.compile(art + mid, re.S)
              ms = list(pat.finditer(html))
              assert len(ms) == 1, label + ': matched ' + str(len(ms))
              mo = ms[0]
              html = html[:mo.end(1)] + snippet + html[mo.end(1):]
              print('inserted', label)
          insert_card('card', 'BOOK IN PROGRESS', 'The Curiosity Hub', thumb('card-visual', 'the-curiosity-engine.pdf', 'curiosity-engine-cover.png', 'The Curiosity Engine deck - first slide', 'Open The Curiosity Engine deck'), 'hub-curiosity')
          insert_card('card', 'FRAMEWORK HUB', 'Leadership in the Age of AI', thumb('card-visual', 'recode-keynote-deck.pdf', 'recode-keynote-deck-cover.png', 'Recode keynote deck - first slide: Building the AI Blueprint for the Next Decade', 'Open the Recode keynote deck'), 'hub-leadership-ai')
          insert_card('card', 'PODCAST', 'Update Your Priors', thumb('card-visual', 'every-model-begins-with-a-prior-deck.pdf', 'every-model-deck-cover.png', 'Every Model Begins with a Prior deck - first slide', 'Open the Every Model Begins with a Prior deck'), 'hub-podcast')
          insert_card('card', 'FRAMEWORK', 'Leading with Curiosity', thumb('card-visual contain', 'leading-with-curiosity.html', 'curiosity-compass.svg', 'Curiosity compass - the six elements of the framework around a Bayesian loop', 'Open Leading with Curiosity'), 'framework-leading')
          insert_card('essay-featured', 'FRAMEWORK', 'The Art &amp; Science of Building a Career', thumb('card-visual', 'career-framework.html', 'career-sardertv-thumb.jpg', 'SarderTV interview - The Art and Science of Building a Career', 'Open The Art and Science of Building a Career'), 'framework-career')
          insert_card('card', 'KEYNOTE DECK · RECODE AMSTERDAM', 'Building the AI Blueprint for the Next Decade — the deck', thumb('card-visual', 'recode-keynote-deck.pdf', 'recode-keynote-deck-cover.png', 'Recode keynote deck - first slide: Building the AI Blueprint for the Next Decade', 'Open the Recode keynote deck'), 'deck-recode')
          insert_card('card', 'PRESENTATION', 'The Mathematics Singularity', thumb('card-visual', 'the-mathematics-singularity.pdf', 'mathematics-singularity-cover.png', 'The Mathematics Singularity deck - first slide', 'Open The Mathematics Singularity deck'), 'deck-mathematics')
          insert_card('card', 'PRESENTATION', 'Every Model Begins with a Prior', thumb('card-visual', 'every-model-begins-with-a-prior-deck.pdf', 'every-model-deck-cover.png', 'Every Model Begins with a Prior deck - first slide', 'Open the Every Model Begins with a Prior deck'), 'deck-everymodel')
          insert_card('card', 'PRESENTATION', 'The Curiosity Engine', thumb('card-visual', 'the-curiosity-engine.pdf', 'curiosity-engine-cover.png', 'The Curiosity Engine deck - first slide', 'Open The Curiosity Engine deck'), 'deck-engine')
          insert_card('essay-featured', 'FEATURED ESSAY', 'Every Model Begins with a Prior', thumb('card-visual', 'every-model-begins-with-a-prior.html', 'every-model-deck-cover.png', 'Every Model Begins with a Prior deck - first slide', 'Open Every Model Begins with a Prior'), 'writing-everymodel')
          insert_card('card', 'FRAMEWORK', 'The Art &amp; Science of Building a Career', thumb('card-visual', 'career-framework.html', 'career-sardertv-thumb.jpg', 'SarderTV interview - The Art and Science of Building a Career', 'Open The Art and Science of Building a Career'), 'writing-career')
          insert_card('card', 'TRAVEL', 'What the World Has Taught Me', thumb('card-visual', 'what-the-world-has-taught-me.html', '29-cities-2025-collage.jpg', '2025 travels - twenty-nine cities', 'Open What the World Has Taught Me'), 'beyond-world')
          strat_pat = re.compile(r'(<article\b[^>]*>\s*<a\b[^>]*href="https://tigertyagarajan\.com/curiosity-the-strategic-advantage\.pdf"[^>]*>)', re.S)
          strat = list(strat_pat.finditer(html))
          assert len(strat) == 1, 'deck-strategic: matched ' + str(len(strat))
          span = '<span class="card-visual"><img src="assets/curiosity-strategic-advantage-cover.png" alt="Curiosity is the Strategic Advantage deck - first slide" loading="lazy"></span>'
          assert span not in html, 'deck-strategic: already inserted'
          sm2 = strat[0]
          html = html[:sm2.end(1)] + span + html[sm2.end(1):]
          print('inserted deck-strategic')
          assert 'data:image' not in html, 'inlined image found in patched index.html'
          assert 'class="thumb"' not in html, 'unexpected thumb class'
          for img in ['curiosity-engine-cover.png', 'recode-keynote-deck-cover.png', 'every-model-deck-cover.png', 'mathematics-singularity-cover.png', 'curiosity-strategic-advantage-cover.png', 'curiosity-compass.svg', 'career-sardertv-thumb.jpg', '29-cities-2025-collage.jpg']:
              assert Path('assets/' + img).exists(), 'missing referenced image ' + img
              assert Path('assets/' + img).stat().st_size > 1000, 'image too small ' + img
          assert html.count('class="card-visual"') == 12, 'plain card-visual count wrong: ' + str(html.count('class="card-visual"'))
          assert html.count('class="card-visual contain"') == 1, 'contain card-visual count wrong'
          Path('index.html').write_text(html, encoding='utf-8')
          print('patched index.html,', len(html), 'chars')
          PY
      - name: Commit and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/card-visuals.yml
          git add -A
          git status --short
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Add a visual to every asset card that has one"
          git push
