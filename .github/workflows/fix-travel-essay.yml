name: Fix travel essay stray rule
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stray horizontal-rule paragraph
        run: |
          echo "Before:"
          grep -rn '<p>---</p>' what-the-world-has-taught-me.html posts/*.html || true
          sed -i '/<p>---<\/p>/d' what-the-world-has-taught-me.html posts/*.html
          echo "After (should be empty):"
          if grep -rn '<p>---</p>' what-the-world-has-taught-me.html posts/*.html; then echo "stray line still present"; exit 1; fi
          git diff --stat
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-travel-essay.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git add -A
          git status --short
          git commit -m "Remove stray rule line from travel essay page"
          git push
