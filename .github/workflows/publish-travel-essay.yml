name: Publish travel essay
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build travel essay pages
        run: python3 _build_travel.py
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f travel-learnings-essay-draft-v2.md travel-posts-full-text.md SELECTIONS.md _build_travel.py
          rm -f .github/workflows/publish-travel-essay.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git add -A
          git status --short
          git commit -m "Publish travel essay 'What the World Has Taught Me' with 16 preserved posts and homepage card"
          git push
