name: Rename tiger-bytes to index
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rename-to-index.yml']
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file and remove workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm index.html
          git mv tiger-bytes.html index.html
          git rm .github/workflows/rename-to-index.yml
          git commit -m "Point deck links to the standalone deck file"
          git push
