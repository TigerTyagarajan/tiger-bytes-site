name: Rename tiger-bytes to index
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename tiger-bytes.html to index.html and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f tiger-bytes.html ]; then
            git mv tiger-bytes.html index.html
            git commit -m "Rename tiger-bytes.html to index.html"
            git push
          fi
          rm -f .github/workflows/rename.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove rename workflow"
            git push
          fi
