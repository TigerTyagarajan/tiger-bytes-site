name: Rename build file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename tiger-bytes.html to index.html and commit
        run: |
          git config user.name "TigerTyagarajan"
          git config user.email "TigerTyagarajan@users.noreply.github.com"
          git mv tiger-bytes.html index.html
          git rm .github/workflows/rename.yml
          git status --short
          ls -lh index.html
          git commit -m "Add RECODE keynote video and deck"
          git push
          git show --stat HEAD
