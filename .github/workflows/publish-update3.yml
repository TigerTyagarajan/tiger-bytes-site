name: "Publish update 3 - Kimberly feedback set"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Verify hashes before replacing index.html"
        run: |
          echo "d25b4e400d654fc91785af2a256317f9f2199db1f67ba6dc5117cb532d9f2b1d  index.html" | sha256sum -c -
          echo "d2de4bdb61ddd9cba36081d94b2984567f1166fbac6f0108e9755e9ae3a1de89  index-update3.html" | sha256sum -c -
          echo "419fd9174cd53319ce0bb0e7ff1a82ebeee0ee189c86fa7bfdd0724d46048388  speaking.html" | sha256sum -c -
      - name: "Replace index.html, keep speaking page, self-delete workflow"
        run: |
          mv index-update3.html index.html
          rm .github/workflows/publish-update3.yml
          git config user.name "Tiger Bytes publish"
          git config user.email "publish@tigertyagarajan.com"
          git add -A
          git commit -m "Kimberly feedback set - AI and Leadership and Careers names, Start Here, Speaking page, LinkedIn button, breathing room"
          git push
