name: Fix cricket post list numbering

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cricket essay pages
        run: python3 _build_cricket.py
      - name: Commit and publish
        run: |
          git config user.name "TigerTyagarajan"
          git config user.email "tigertyagarajan@gmail.com"
          rm -f cricket-leadership-essay-draft-v2.md cricket-posts-full-text.md SELECTIONS.md _build_cricket.py .github/workflows/fix-cricket-list-numbering.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git add -A
          git status --short
          git commit -m "Fix numbered-list rendering in preserved cricket post (Gambhir press conference, Jan 2025)" || echo "nothing to commit"
          git push
