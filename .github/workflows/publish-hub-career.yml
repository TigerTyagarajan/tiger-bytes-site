name: "Publish hub career button"
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Verify pre-image, swap in patched file, verify post-image"
        shell: bash
        run: |
          set -euo pipefail
          cur=$(sha256sum "index.html" | cut -d" " -f1)
          if [ "$cur" != "b9babe58c89c491ab7bf4e25283d317a1711aaaceb3068622fb7a03aecdb0cd5" ]; then echo "b9babe58c89c491ab7bf4e25283d317a1711aaaceb3068622fb7a03aecdb0cd5-IMAGE MISMATCH: $cur"; exit 1; fi
          cp ".cta-staging/index.html" "index.html"
          new=$(sha256sum "index.html" | cut -d" " -f1)
          if [ "$new" != "34c77df840332d4693aeeeeb0d2efc7da25180f98d106742eace351d0abb9271" ]; then echo "34c77df840332d4693aeeeeb0d2efc7da25180f98d106742eace351d0abb9271-IMAGE MISMATCH: $new"; exit 1; fi
          echo "OK index.html"
      - name: "Commit update and clean up"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tiger Tyagarajan"
          git config user.email "vn.tyagarajan@gmail.com"
          git add index.html
          git commit -m "Make hub career framework link a button"
          rm -rf .cta-staging .github/workflows/publish-hub-career.yml
          git add -A
          git commit -m "Remove hub career publish staging and workflow" || true
          git push
