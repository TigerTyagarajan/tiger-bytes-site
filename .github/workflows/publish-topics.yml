name: "Publish topic restructure"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Verify hashes before replacing index.html"
        run: |
          echo "1073fbc08cbcef1a9f5d98628414b81f168440f05bc84445f8e7ba0b3bbf8620  index.html" | sha256sum -c -
          echo "d25b4e400d654fc91785af2a256317f9f2199db1f67ba6dc5117cb532d9f2b1d  index-topics.html" | sha256sum -c -
      - name: "Replace index.html and self-delete this workflow"
        run: |
          mv index-topics.html index.html
          rm .github/workflows/publish-topics.yml
          git config user.name "Tiger Bytes publish"
          git config user.email "publish@tigertyagarajan.com"
          git add -A
          git commit -m "Reorganise by topic - curiosity, AI leadership, learning and updating, building careers and leading"
          git push
