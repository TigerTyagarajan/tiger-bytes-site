name: Publish cricket essay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cricket essay pages
        run: python3 _build_cricket.py
      - name: Commit and publish
        run: |
          git config user.name "TigerTyagarajan"
          git config user.email "tigertyagarajan@gmail.com"
          rm -f cricket-leadership-essay-draft-v2.md cricket-posts-full-text.md SELECTIONS.md _build_cricket.py .github/workflows/publish-cricket-essay.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git add -A
          git status --short
          git commit -m "Publish cricket essay 'What Cricket Has Taught Me About Leadership' with 16 preserved posts and homepage card" || echo "nothing to commit"
          git push
