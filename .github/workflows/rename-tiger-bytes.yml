name: Rename tiger-bytes to index
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rename-tiger-bytes.yml
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename, push, then remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv tiger-bytes.html index.html
          git commit -m "Rename tiger-bytes.html to index.html"
          git push
          rm .github/workflows/rename-tiger-bytes.yml
          git add -A
          git commit -m "Remove temporary rename workflow"
          git push
