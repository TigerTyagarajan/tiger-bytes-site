name: Temporary rename
on:
  push:
    paths:
      - '.github/workflows/temp-rename.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename tiger-bytes.html to index.html and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv tiger-bytes.html index.html
          rm .github/workflows/temp-rename.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git add -A
          git commit -m "Rename tiger-bytes.html to index.html"
          git push
