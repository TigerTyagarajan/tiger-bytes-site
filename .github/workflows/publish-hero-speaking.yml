name: "Publish hero speaking button"
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Verify pre-image, swap in patched file, verify post-image"
        shell: bash
        run: |
          set -euo pipefail
          cur=$(sha256sum "index.html" | cut -d" " -f1)
          if [ "$cur" != "65049b5691e6d457ff8d51d53d9dddb1ea05e1c6599db905dc5579192724412d" ]; then echo "PRE-IMAGE MISMATCH: $cur"; exit 1; fi
          cp ".cta-staging/index.html" "index.html"
          new=$(sha256sum "index.html" | cut -d" " -f1)
          if [ "$new" != "b9babe58c89c491ab7bf4e25283d317a1711aaaceb3068622fb7a03aecdb0cd5" ]; then echo "POST-IMAGE MISMATCH: $new"; exit 1; fi
          echo "OK index.html"
      - name: "Commit update and clean up"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tiger Tyagarajan"
          git config user.email "vn.tyagarajan@gmail.com"
          git add index.html
          git commit -m "Match hero speaking button style to subscribe button"
          rm -rf .cta-staging .github/workflows/publish-hero-speaking.yml
          git add -A
          git commit -m "Remove hero speaking publish staging and workflow" || true
          git push
