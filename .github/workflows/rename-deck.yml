name: Rename deck file
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rename-deck.yml']
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename deck and remove workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv recode-keynote-deck-review.pdf recode-keynote-deck.pdf
          git rm .github/workflows/rename-deck.yml
          git commit -m "Rename deck to recode-keynote-deck.pdf"
          git push
