name: "Publish Trust Is the New Currency"
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Verify pre-image, swap in patched files, verify post-images"
        shell: bash
        run: |
          set -euo pipefail
          cur=$(sha256sum "index.html" | cut -d" " -f1)
          if [ "$cur" != "7cb288ace6fe42a1c75d7ebd33e66b897fda350635ea4a02c6ec25adeba2c6a4" ]; then echo "PRE-IMAGE MISMATCH index.html: $cur"; exit 1; fi
          if [ -e "trust-is-the-new-currency.html" ]; then echo "trust-is-the-new-currency.html ALREADY EXISTS"; exit 1; fi
          if [ -e "assets/08c4266fdac19443.jpg" ]; then echo "asset ALREADY EXISTS"; exit 1; fi
          cp ".cta-staging/index.html" "index.html"
          cp ".cta-staging/trust-is-the-new-currency.html" "trust-is-the-new-currency.html"
          cp ".cta-staging/assets/08c4266fdac19443.jpg" "assets/08c4266fdac19443.jpg"
          new=$(sha256sum "index.html" | cut -d" " -f1)
          if [ "$new" != "e0775a494abbb0319a4bda1bd451b3ab62e564dafb9c75a3354da83037b3f54f" ]; then echo "POST-IMAGE MISMATCH index.html: $new"; exit 1; fi
          pg=$(sha256sum "trust-is-the-new-currency.html" | cut -d" " -f1)
          if [ "$pg" != "797748b65426020bec3e8174a92a43503877d9078e317f1938730ea4f8cf5027" ]; then echo "POST-IMAGE MISMATCH page: $pg"; exit 1; fi
          th=$(sha256sum "assets/08c4266fdac19443.jpg" | cut -d" " -f1)
          if [ "$th" != "0f4a249452d4644b3215400d1860ed19d877cdd9fe01e337ac28d59e081ac949" ]; then echo "POST-IMAGE MISMATCH asset: $th"; exit 1; fi
          echo "OK all three files"
      - name: "Commit update and clean up"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tiger Tyagarajan"
          git config user.email "vn.tyagarajan@gmail.com"
          git add index.html trust-is-the-new-currency.html assets/08c4266fdac19443.jpg
          git commit -m "Add Trust Is the New Currency - Leadership Enigma takeaways, Talks card, hub link"
          rm -rf .cta-staging .github/workflows/publish-trust-currency.yml
          git add -A
          git commit -m "Remove Trust Is the New Currency publish staging and workflow" || true
          git push
