name: "Publish Tiger Bytes batch 2026-11-18"
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Verify pre-image, swap in staged files, verify post-images"
        shell: bash
        run: |
          set -euo pipefail
          cur=$(sha256sum "index.html" | cut -d" " -f1)
          if [ "$cur" != "62fac38737165ba25e6a951428142865a1ffa9c6b38cc720528b518936fe4f91" ]; then echo "PRE-IMAGE MISMATCH index.html: $cur"; exit 1; fi
          if [ -e "language-and-linguistics.html" ]; then echo "language-and-linguistics.html ALREADY EXISTS"; exit 1; fi
          if [ -e "food-and-wine.html" ]; then echo "food-and-wine.html ALREADY EXISTS"; exit 1; fi
          if [ -e "assets/reflections-of-a-ceo-frame.jpg" ]; then echo "assets/reflections-of-a-ceo-frame.jpg ALREADY EXISTS"; exit 1; fi
          cp ".cta-staging/index.html" "index.html"
          cp ".cta-staging/language-and-linguistics.html" "language-and-linguistics.html"
          cp ".cta-staging/food-and-wine.html" "food-and-wine.html"
          cp ".cta-staging/assets/reflections-of-a-ceo-frame.jpg" "assets/reflections-of-a-ceo-frame.jpg"
          new=$(sha256sum "index.html" | cut -d" " -f1)
          if [ "$new" != "6d44aaac9651487e9a3efa03f279be2c15563ab676de7ab01e287ba35ceb8bb7" ]; then echo "POST-IMAGE MISMATCH index.html: $new"; exit 1; fi
          a1=$(sha256sum "language-and-linguistics.html" | cut -d" " -f1)
          if [ "$a1" != "2f74633e7d6cc306b9ba192f3c2046467fd73f611e4f44298d7fbffb56320c11" ]; then echo "POST-IMAGE MISMATCH language-and-linguistics.html: $a1"; exit 1; fi
          a2=$(sha256sum "food-and-wine.html" | cut -d" " -f1)
          if [ "$a2" != "238732cd750b838682b5e562812934c130aacca6c9f54da1bd151adccb593256" ]; then echo "POST-IMAGE MISMATCH food-and-wine.html: $a2"; exit 1; fi
          a3=$(sha256sum "assets/reflections-of-a-ceo-frame.jpg" | cut -d" " -f1)
          if [ "$a3" != "45b9f39ece40fedef978f66d85420465243d7375df6d5bad26c53a5e15484eee" ]; then echo "POST-IMAGE MISMATCH assets/reflections-of-a-ceo-frame.jpg: $a3"; exit 1; fi
          echo "OK index.html + 2 pages + 1 asset"
      - name: "Commit update and clean up"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tiger Tyagarajan"
          git config user.email "vn.tyagarajan@gmail.com"
          git add index.html language-and-linguistics.html food-and-wine.html assets/reflections-of-a-ceo-frame.jpg
          git commit -m "Batch Nov 18: ex-CEO line, Top Reads order, Curiosity Hub buttons, Learning title, Reflections frame, Beyond Work pillars and move, speaking enquiries"
          rm -rf .cta-staging .github/workflows/publish-batch-2026-11-18.yml
          git add -A
          git commit -m "Remove batch publish staging and workflow" || true
          git push
