name: Rename tiger-bytes.html to index.html

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename tiger-bytes.html to index.html and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv tiger-bytes.html index.html
          rm .github/workflows/rename-index.yml
          git add -A
          git commit -m "Rename tiger-bytes.html to index.html"
          git push
