name: Rename tiger-bytes to index
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename tiger-bytes.html to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f tiger-bytes.html ]; then
            echo "tiger-bytes.html not found; nothing to rename"
            exit 0
          fi
          git mv tiger-bytes.html index.html
          git rm -q .github/workflows/rename-index.yml
          git commit -m "Rename tiger-bytes.html to index.html"
          git push
