name: Rename tiger-bytes to index

on:
  push:
    paths:
      - '.github/workflows/rename-index.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename tiger-bytes.html to index.html
        run: |
          git config user.name "TigerTyagarajan"
          git config user.email "TigerTyagarajan@users.noreply.github.com"
          git mv tiger-bytes.html index.html
          git commit -m "Rename tiger-bytes.html to index.html"
          git push
          git rm .github/workflows/rename-index.yml
          git commit -m "Remove rename-index workflow"
          git push
