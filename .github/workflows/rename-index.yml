name: Rename tiger-bytes to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv tiger-bytes.html index.html
          git rm .github/workflows/rename-index.yml
          git commit -m "Rename tiger-bytes.html to index.html"
          git push
